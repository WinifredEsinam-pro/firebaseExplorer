<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<title>Firestore explorer</title>
</head>
<body>
<main>
  <h1>Firestore explorer</h1>
  <p class="sub">Pick a collection to view and download it, or fetch the structure of the whole database.</p>

  <section class="pick">
    <h2>One collection</h2>
    <label for="col">Collection</label>
    <select id="col"><option value="">Loading…</option></select>
    <button id="view" disabled>View</button>
    <button id="dlJson" class="secondary" disabled>Download JSON</button>
    <button id="dlSql" class="secondary" disabled>Download SQL</button>
    <div id="colStatus" role="status"></div>
    <div id="colOut"></div>
  </section>

  <h2>Whole database</h2>
  <button id="fetch">Fetch database structure</button>
  <button id="download" class="secondary" hidden>Download JSON</button>
  <div id="status" role="status"></div>
  <div id="out"></div>
</main>
<script>
  const $ = id => document.getElementById(id);
  let last = null;

  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  $("fetch").onclick = async () => {
    $("fetch").disabled = true;
    $("status").className = ""; $("status").textContent = "Reading the database…";
    $("out").innerHTML = ""; $("download").hidden = true;
    try {
      const res = await fetch("/api/discover");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      last = data;
      const names = Object.keys(data.collections);
      $("status").textContent = `Project ${data.projectId}: ${names.length} collection paths found.`;
      $("out").innerHTML = names.map(n => {
        const c = data.collections[n];
        const rows = Object.entries(c.fields)
          .map(([f, t]) => `<tr><td>${esc(f)}</td><td>${esc(t.join(" | "))}</td></tr>`).join("");
        return `<details><summary>${esc(n)}<span>${c.docCount} documents</span></summary>
          <h3>Fields</h3><table><tr><th>Field</th><th>Types seen</th></tr>${rows}</table>
          <h3>Sample documents</h3><pre>${esc(JSON.stringify(c.samples, null, 2))}</pre></details>`;
      }).join("");
      $("download").hidden = false;
    } catch (e) {
      $("status").className = "error";
      $("status").textContent = "Failed: " + e.message;
    } finally { $("fetch").disabled = false; }
  };

 
  let cols = [];

  async function loadCollections() {
    try {
      const res = await fetch("/api/collections");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      cols = data.collections;
      $("col").innerHTML = '<option value="">Choose a collection…</option>' +
        cols.map(c => `<option value="${esc(c.name)}">${esc(c.name)} (${c.count})</option>`).join("");
    } catch (e) {
      $("col").innerHTML = '<option value="">Could not load</option>';
      $("colStatus").className = "error";
      $("colStatus").textContent = "Failed: " + e.message;
    }
  }

  $("col").onchange = () => {
    const c = cols.find(x => x.name === $("col").value);
    $("view").disabled = !c;
    $("dlJson").disabled = !c;
    $("dlSql").disabled = !c;
    $("colOut").innerHTML = ""; $("colStatus").className = "";
    $("colStatus").textContent = !c ? "" : c.custom
      ? "SQL uses a hand-made table design for this collection."
      : "SQL tables are designed automatically from the data (including any subcollections).";
  };

  const cell = v => v !== null && typeof v === "object"
    ? `<pre>${esc(JSON.stringify(v, null, 1))}</pre>` : esc(v ?? "");

  $("view").onclick = async () => {
    const name = $("col").value;
    $("view").disabled = true;
    $("colStatus").className = ""; $("colStatus").textContent = `Reading ${name}…`;
    $("colOut").innerHTML = "";
    try {
      const res = await fetch("/api/collection/" + encodeURIComponent(name));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      const fields = ["_id", ...new Set(data.docs.flatMap(d => Object.keys(d).filter(k => k !== "_id" && k !== "__subcollections")))];
      const subs = [...new Set(data.docs.flatMap(d => Object.keys(d.__subcollections || {})))];
      $("colOut").innerHTML = `<div class="scroll"><table><tr>${fields.map(f => `<th>${esc(f)}</th>`).join("")}` +
        `${subs.map(s => `<th>↳ ${esc(s)} (subcollection)</th>`).join("")}</tr>` +
        data.docs.map(d => `<tr>${fields.map(f => `<td>${cell(d[f])}</td>`).join("")}` +
          `${subs.map(s => `<td>${cell((d.__subcollections || {})[s])}</td>`).join("")}</tr>`).join("") + `</table></div>`;
      $("colStatus").textContent = data.total > data.shown
        ? `Showing the first ${data.shown} of ${data.total} documents. The download contains all ${data.total}.`
        : `Showing all ${data.total} documents.`;
    } catch (e) {
      $("colStatus").className = "error";
      $("colStatus").textContent = "Failed: " + e.message;
    } finally { $("view").disabled = false; }
  };

  const save = format => {
    const a = document.createElement("a");
    a.href = `/api/collection/${encodeURIComponent($("col").value)}/download?format=${format}`;
    a.click();
  };
  $("dlJson").onclick = () => save("json");
  $("dlSql").onclick = () => save("sql");

  loadCollections();

  $("download").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(last, null, 2)], {type:"application/json"}));
    a.download = "firestore-report.json"; a.click();
  };
</script>
</body>
</html>
